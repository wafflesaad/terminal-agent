[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-ollama",
    "langchain-groq",
    "langgraph-checkpoint-sqlite",
    "prompt_toolkit",
    "rich",
    "pydantic",
    "tomli-w",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
termagent = "termagent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["termagent*"]
